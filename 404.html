<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Not found</title>
<link rel="icon" type="image/png" href="/logo.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap');
  :root{
    --bg-0:#03060f;
    --blue-electric:#0057ff;
    --blue-glow:#3d8bff;
    --blue-soft:#9fc4ff;
    --ink:#eaf1ff;
    --ink-dim:#7f93bd;
    --line:rgba(150,180,255,0.14);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%;
    background:var(--bg-0);
    color:var(--ink);
    font-family:'Space Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    overflow-x:hidden;
  }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
  }
  .bg-field{
    position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:
      radial-gradient(ellipse 800px 500px at 50% 0%, rgba(0,87,255,0.22), transparent 60%),
      radial-gradient(ellipse 1000px 700px at 50% 100%, rgba(0,40,120,0.25), transparent 60%),
      var(--bg-0);
  }
  .bg-grid{
    position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:0.3;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:64px 64px;
    mask-image:radial-gradient(ellipse 70% 55% at 50% 30%, black 10%, transparent 75%);
    -webkit-mask-image:radial-gradient(ellipse 70% 55% at 50% 30%, black 10%, transparent 75%);
  }
  body{
    position:relative; z-index:1;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:0; min-height:100vh; text-align:center; padding:6vh 6vw;
  }
  .code{
    font-family:'JetBrains Mono',monospace;
    font-size:clamp(64px,16vw,140px);
    font-weight:700; letter-spacing:-0.02em; line-height:1;
    background:linear-gradient(135deg, var(--blue-soft), var(--blue-glow));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .static-line{
    margin-top:10px;
    font-family:'JetBrains Mono',monospace;
    font-size:12px; letter-spacing:0.3em; text-transform:uppercase;
    color:var(--ink-dim);
    animation:flicker 3.2s ease-in-out infinite;
  }
  @keyframes flicker{
    0%,100%{opacity:.6;} 45%{opacity:1;} 50%{opacity:.3;} 55%{opacity:1;}
  }
  h1{
    margin-top:26px;
    font-size:clamp(20px,3vw,28px);
    font-weight:700; letter-spacing:-0.01em;
  }
  p{
    margin-top:10px;
    color:var(--ink-dim);
    font-size:14.5px;
    max-width:420px;
    line-height:1.6;
  }
  .path-tag{
    margin-top:18px;
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--blue-soft);
    background:rgba(0,87,255,0.08);
    border:1px solid rgba(120,175,255,0.25);
    padding:8px 14px;
    border-radius:20px;
    word-break:break-all;
    max-width:90vw;
  }
  .home-btn{
    margin-top:32px;
    display:inline-flex; align-items:center; gap:8px;
    padding:13px 26px;
    border-radius:12px;
    background:linear-gradient(135deg, var(--blue-electric), var(--blue-glow));
    color:#fff; text-decoration:none;
    font-weight:700; font-size:14px; letter-spacing:0.01em;
    box-shadow:0 10px 30px rgba(0,87,255,0.3);
    transition:transform .2s, box-shadow .2s, filter .2s;
  }
  .home-btn:hover{ transform:translateY(-2px); box-shadow:0 14px 36px rgba(0,87,255,0.45); filter:brightness(1.08); }
  footer{
    position:relative; z-index:1;
    margin-top:48px;
    font-size:11px; color:var(--ink-dim); letter-spacing:0.05em;
  }
</style>
</head>
<body>
  <div class="bg-field"></div>
  <div class="bg-grid"></div>

  <div class="code">404</div>
  <div class="static-line">Bu sayfayı bulamadık</div>
  <h1>404</h1>
  <div class="path-tag" id="pathTag"></div>
  <a class="home-btn" href="/">← Back</a>


  <script>
    document.getElementById('pathTag').textContent = location.pathname;
  </script>
</body>
</html>
